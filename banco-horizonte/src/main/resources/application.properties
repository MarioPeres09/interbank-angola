spring.application.name=banco-horizonte
server.address=127.0.0.1
server.port=8082
spring.datasource.url=jdbc:postgresql://127.0.0.1:${INTERBANK_DB_PORT:5433}/banco_horizonte
spring.datasource.username=interbank_horizonte
spring.datasource.password=${HORIZONTE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
interbank.incoming-password=${INTERBANK_SHARED_PASSWORD}
interbank.outgoing-secret=${HORIZONTE_INTERBANK_PASSWORD}
interbank.jwt.secret=${HORIZONTE_JWT_SECRET}
interbank.recovery-delay-ms=${INTERBANK_RECOVERY_DELAY_MS:15000}
interbank.router-url=${INTERBANK_ROUTER_URL:http://127.0.0.1:8083}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
interbank.events.enabled=${INTERBANK_EVENTS_ENABLED:false}
