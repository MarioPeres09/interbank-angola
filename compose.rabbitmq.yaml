x-events: &events
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_VIRTUAL_HOST: interbank
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?Preenche RABBITMQ_DEFAULT_USER em .env.rabbitmq}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Preenche RABBITMQ_DEFAULT_PASS em .env.rabbitmq}

services:
  banco-kwanza:
    environment:
      <<: *events
      INTERBANK_EVENTS_ENABLED: "true"

  banco-horizonte:
    environment:
      <<: *events
      INTERBANK_EVENTS_ENABLED: "true"

  notificacoes:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      args: { SERVICE: notificacoes }
    environment: *events
    volumes:
      - notificacoes-data:/app/data
    depends_on:
      rabbitmq: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: interbank-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Preenche RABBITMQ_DEFAULT_USER em .env.rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Preenche RABBITMQ_DEFAULT_PASS em .env.rabbitmq}
      RABBITMQ_DEFAULT_VHOST: interbank
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  rabbitmq-data:
  notificacoes-data:
