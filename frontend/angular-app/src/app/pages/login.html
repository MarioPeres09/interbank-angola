<main class="login-page" [class.horizonte]="session.bank() === 'horizonte'">
  <section class="login-brand" aria-label="InterBank Angola">
    <strong>InterBank Angola</strong>
    <span>{{ banks[session.bank()].name }}</span>
    <p>Plataforma de Transferências Interbancárias Instantâneas</p>
  </section>
  <section class="login-content" aria-labelledby="login-title">
    <div class="login-panel">
      <h1 id="login-title">Iniciar sessão</h1>
      <p>Acede às tuas contas e transferências no banco seleccionado.</p>
      <form (ngSubmit)="submit()" #loginForm="ngForm">
        <label for="login-bank">Banco</label>
        <select id="login-bank" name="bank" [ngModel]="session.bank()"
                (ngModelChange)="selectBank($event)" [disabled]="submitting()">
          <option value="kwanza">Banco Kwanza</option>
          <option value="horizonte">Banco Horizonte</option>
        </select>
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" email maxlength="254" autocomplete="username" [(ngModel)]="email" required>
        <label for="login-password">Palavra-passe</label>
        <input id="login-password" name="password" type="password" maxlength="72" autocomplete="current-password" [(ngModel)]="password" required>
        @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
        <button type="submit" [disabled]="loginForm.invalid || submitting()">
          {{ submitting() ? 'A iniciar sessão…' : 'Entrar' }}
        </button>
      </form>
    </div>
  </section>
</main>
