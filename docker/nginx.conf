server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $kwanza http://banco-kwanza:8081;
        proxy_pass $kwanza$request_uri;
    }

    location /horizonte/api/ {
        set $horizonte http://banco-horizonte:8082;
        rewrite ^/horizonte(/api/.*)$ $1 break;
        proxy_pass $horizonte$uri$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
